name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.78.0"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets --features testutils -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run all tests
        run: cargo test --all --features testutils
      - name: Run property-based tests
        run: cargo test prop_ --all --features testutils

  error-coverage:
    name: ContractError Coverage Gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify every ContractError variant has a regression test
        run: |
          set -euo pipefail
          ERR_FILE="contracts/governance/src/errors.rs"
          TEST_FILE="contracts/governance/src/error_coverage_tests.rs"
          if [ ! -f "$ERR_FILE" ]; then
            echo "Error: $ERR_FILE not found"
            exit 1
          fi
          if [ ! -f "$TEST_FILE" ]; then
            echo "Error: $TEST_FILE not found"
            exit 1
          fi
          # Extract variant names from the ContractError enum body.
          variants=$(awk '/pub enum ContractError/{flag=1;next}/^}/{flag=0}flag' "$ERR_FILE" \
            | grep -E '^[[:space:]]*[A-Z][A-Za-z0-9_]*' \
            | sed -E 's/^[[:space:]]*([A-Z][A-Za-z0-9_]*).*/\1/' \
            | sort -u)
          if [ -z "$variants" ]; then
            echo "Error: could not extract ContractError variants from $ERR_FILE"
            exit 1
          fi
          missing=0
          for variant in $variants; do
            if ! grep -qE "test_[a-z0-9_]*${variant}|${variant}" "$TEST_FILE"; then
              echo "Missing regression test for ContractError::$variant"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Error: one or more ContractError variants lack a regression test in $TEST_FILE"
            exit 1
          fi
          echo "All ContractError variants have regression tests."

  benchmark:
    name: Instruction Count Benchmarks
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run instruction count benchmarks
        run: cargo test bench_ --features testutils -- --nocapture

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [fmt, lint, test, benchmark]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build WASM binaries
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Check WASM sizes
        run: |
          echo "=== WASM binary sizes ==="
          find target/wasm32-unknown-unknown/release -name "*.wasm" -exec ls -lh {} \;
          # Size budget rationale: 
          # Keeping WASM binaries under 100KB ensures fast deployment and execution 
          # on the Stellar network, minimizing gas costs and execution timeouts.
          for wasm_file in target/wasm32-unknown-unknown/release/*.wasm; do
            size=$(stat -c%s "$wasm_file")
            if [ "$size" -gt 102400 ]; then
              echo "Error: $wasm_file exceeds the 100KB size limit ($size bytes)"
              exit 1
            fi
          done
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wasm-binaries
          path: target/wasm32-unknown-unknown/release/*.wasm
          retention-days: 7

  deployment-tooling:
    name: Deployment Tooling Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint shell scripts
        run: |
          find scripts/ -name '*.sh' | xargs -I{} bash -n {}
      - name: Install Docker Compose
        run: docker compose version || (sudo apt-get update && sudo apt-get install -y docker-compose-plugin)
      - name: Validate Docker Compose config
        run: docker compose config --quiet

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check Rust dependency licenses
        run: cargo deny check licenses

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend dependency licenses
        working-directory: frontend
        run: npm run license-check

  coverage:
    name: Contract Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage report
        run: cargo tarpaulin --out Xml --output-dir coverage/ --features testutils --exclude-files "*/test*" --fail-under 80
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: coverage/cobertura.xml
          fail_ci_if_error: false

  actionlint:
    name: Lint GitHub Actions (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv actionlint /usr/local/bin/
      - name: Run actionlint
        run: actionlint -color

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run coverage (fail below threshold)
        run: npm run coverage

  # ─── Failure Notification ──────────────────────────────────────────────────
  # Sends a Slack/Discord alert when any CI job fails on main or develop.
  # Configure the webhook URL as a repository secret named CI_ALERT_WEBHOOK_URL.
  # Success notifications are off by default (set NOTIFY_ON_SUCCESS=true to enable).
  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs:
      - fmt
      - lint
      - test
      - benchmark
      - build
      - deployment-tooling
      - license-check
      - coverage
      - actionlint
      - frontend-coverage
    if: ${{ always() && github.event_name == 'push' && contains(fromJson('["main", "develop"]'), github.ref_name) }}
    env:
      CI_ALERT_WEBHOOK_URL: ${{ secrets.CI_ALERT_WEBHOOK_URL }}
    steps:
      - name: Determine which jobs failed
        id: check
        run: |
          FAILED_JOBS=""
          for job_result in \
            "Formatting:${{ needs.fmt.result }}" \
            "Clippy:${{ needs.lint.result }}" \
            "Tests:${{ needs.test.result }}" \
            "Instruction Count Benchmarks:${{ needs.benchmark.result }}" \
            "Build WASM:${{ needs.build.result }}" \
            "Deployment Tooling Checks:${{ needs.deployment-tooling.result }}" \
            "License Compliance:${{ needs.license-check.result }}" \
            "Contract Coverage:${{ needs.coverage.result }}" \
            "Lint GitHub Actions:${{ needs.actionlint.result }}" \
            "Frontend Coverage:${{ needs.frontend-coverage.result }}"; do
            name="${job_result%%:*}"
            result="${job_result##*:}"
            if [[ "$result" == "failure" ]]; then
              if [[ -n "$FAILED_JOBS" ]]; then
                FAILED_JOBS="${FAILED_JOBS}, ${name}"
              else
                FAILED_JOBS="${name}"
              fi
            fi
          done
          echo "failed_jobs=$FAILED_JOBS" >> "$GITHUB_OUTPUT"
          if [[ -n "$FAILED_JOBS" ]]; then
            echo "any_failure=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_failure=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send Slack/Discord alert on failure
        if: steps.check.outputs.any_failure == 'true' && env.CI_ALERT_WEBHOOK_URL != ''
        run: |
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          FAILED_JOBS="${{ steps.check.outputs.failed_jobs }}"

          PAYLOAD=$(cat <<EOF
          {
            "text": "🚨 CI Failure on *${BRANCH}*\n\n*Commit:* ${SHORT_SHA} (${COMMIT_SHA})\n*Failing job(s):* ${FAILED_JOBS}\n*Run:* ${RUN_URL}\n\nPlease investigate and fix."
          }
          EOF
          )

          echo "Sending CI failure alert to webhook..."
          curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$CI_ALERT_WEBHOOK_URL" \
            -w "\nHTTP_STATUS: %{http_code}\n"

      - name: Skip notification (no webhook configured)
        if: steps.check.outputs.any_failure == 'true' && env.CI_ALERT_WEBHOOK_URL == ''
        run: |
          echo "⚠️  CI_ALERT_WEBHOOK_URL secret is not configured."
          echo "    To enable Slack/Discord alerts, add the webhook URL as a repository secret."
          echo "    Failing job(s): ${{ steps.check.outputs.failed_jobs }}"
