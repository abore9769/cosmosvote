[package]
name = "cosmosvote-governance"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "CosmosVote governance contract — on-chain proposals and token-weighted voting on Stellar Soroban"
repository = "https://github.com/mercyJJ/cosmosvote"
authors = ["mercyJJ <joymercy7879@gmail.com>"]

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "delegation_vote_weight_tests"
path = "../../tests/delegation_vote_weight_tests.rs"

[[test]]
name = "governance_treasury_cross_contract_tests"
path = "../../tests/governance_treasury_cross_contract_tests.rs"

[dependencies]
soroban-sdk = { version = "26.1.0" }

[dev-dependencies]
soroban-sdk = { version = "26.1.0", features = ["testutils"] }
proptest = "1.6.0"
cosmosvote-token = { path = "../token", features = ["testutils"] }
cosmosvote-treasury = { path = "../treasury", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
